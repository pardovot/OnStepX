name: Release

# Tag push builds both mounts and drafts a release. Manual runs build and upload
# workflow artifacts only, so the pipeline can be tested without cutting a release.
# Publishing the draft is what puts firmware on the site, see publish-pages.yml.
on:
  push:
    tags: [ 'V*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install platformio 'esptool==5.2.0'

      - name: Unit tests
        run: pio test -e native

      - name: Build both mounts
        run: pio run

      - name: Check build output
        run: |
          set -euo pipefail
          for e in umi17 sa17m; do
            for f in firmware.bin flash_images.txt flash_params.txt; do
              test -s ".pio/build/$e/$f" || { echo "missing $f for $e"; exit 1; }
            done
          done
          # identical images mean -DMOUNT_MODEL never reached the compiler and both
          # binaries are the Config.h default, which would ship UMi17 values to SA-17M
          if cmp -s .pio/build/umi17/firmware.bin .pio/build/sa17m/firmware.bin; then
            echo "ERROR: umi17 and sa17m firmware are identical, MOUNT_MODEL is not being applied"
            exit 1
          fi

      - name: Package flashable images
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          mkdir -p dist
          for pair in "umi17:UMi17" "sa17m:SA-17M"; do
            env="${pair%%:*}"; name="${pair##*:}"
            images=".pio/build/$env/flash_images.txt"
            params=".pio/build/$env/flash_params.txt"

            # offsets, images and flash parameters all come from the build itself,
            # so the merged image can never disagree with what was linked
            mode=$(awk '$1=="mode"{print $2}' "$params")
            freq=$(awk '$1=="freq"{print $2}' "$params")
            size=$(awk '$1=="size"{print $2}' "$params")
            [ -n "$mode" ] && [ -n "$freq" ] && [ -n "$size" ] || { echo "bad $params"; exit 1; }

            args=()
            while read -r offset path; do
              [ -f "$path" ] || { echo "image listed in $images not found: $path"; exit 1; }
              args+=("$offset" "$path")
            done < "$images"
            [ ${#args[@]} -ge 8 ] || { echo "expected 4 images in $images"; exit 1; }

            python -m esptool --chip esp32 merge-bin \
              -o "dist/OnStepX-${VERSION}-${name}.bin" \
              --flash-mode "$mode" --flash-freq "$freq" --flash-size "$size" \
              "${args[@]}"

            pdir="parts-$name"
            mkdir -p "$pdir"
            {
              echo "OnStepX ${VERSION} - ${name}"
              echo "ESP32, ${mode}, ${freq}, ${size}"
              echo
            } > "$pdir/offsets.txt"
            while read -r offset path; do
              cp "$path" "$pdir/$(basename "$path")"
              printf '%-9s %s\n' "$offset" "$(basename "$path")" >> "$pdir/offsets.txt"
            done < "$images"
            {
              echo
              echo "Simpler: flash OnStepX-${VERSION}-${name}.bin at 0x0 instead of these."
            } >> "$pdir/offsets.txt"

            (cd "$pdir" && zip -qr "../dist/OnStepX-${VERSION}-parts-${name}.zip" .)
            rm -rf "$pdir"
          done

          (cd dist && sha256sum -- *.bin *.zip > SHA256SUMS.txt)
          ls -l dist

      # one artifact per mount, so the download is named for the mount it belongs
      # to and cannot contain the other mount's firmware
      - uses: actions/upload-artifact@v4
        with:
          name: OnStepX-${{ env.VERSION }}-UMi17
          path: |
            dist/*-UMi17.bin
            dist/*-parts-UMi17.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: OnStepX-${{ env.VERSION }}-SA-17M
          path: |
            dist/*-SA-17M.bin
            dist/*-parts-SA-17M.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # Draft, so nothing is announced until the notes are written. Publishing the
      # draft triggers publish-pages.yml, which is what puts the firmware on the
      # site, so the site and the release page never disagree.
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/V')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release exists, replacing assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --draft \
              --notes "Draft. Binaries built from ${GITHUB_SHA}."
          fi
