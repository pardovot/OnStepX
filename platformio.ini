; PlatformIO Project Configuration File for OnStepX
; OnStepX Arduino project structure

[platformio]
src_dir = .
include_dir = src
default_envs = umi17, sa17m

; Per-mount firmware, differ only by MOUNT_MODEL. `pio run` builds both.
[env:umi17]
extends = env:esp32dev
build_flags = -DMOUNT_MODEL=UMI17

[env:sa17m]
extends = env:esp32dev
build_flags = -DMOUNT_MODEL=SA17M

[env:esp32dev]
; platform = espressif32@6.9.0  ; ESP32 Arduino Core 2.0.17
; platform = espressif32@6.0.1  ; ESP32 Arduino Core 2.0.6
; platform = espressif32@6.1.0  ; ESP32 Arduino Core 2.0.7
; platform = espressif32@6.2.0  ; ESP32 Arduino Core 2.0.8
; platform = espressif32@5.1.1  ; ESP32 Arduino Core 2.0.4
platform = espressif32@4.0.0  ; ESP32 Arduino Core 2.0.0
board = esp32dev
framework = arduino
test_ignore = *
; src_dir is the repo root, so lib/ has to be excluded or the vendored libraries
; are compiled a second time as project sources
build_src_filter = +<*> -<test/> -<lib/>
extra_scripts = post:scripts/dump_flash_images.py

; Third party libraries are vendored in lib/ so a clean checkout builds the same
; firmware anywhere, including CI. See lib/README.md for versions and sources.

; Board configuration
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv

; Upload/Monitor settings
upload_speed = 921600
upload_port = COM5 # needs to be your port in your BS. Windows: COMx. In WSL2 this could be mapped using usbip
monitor_speed = 115200
monitor_echo = yes

; Native test environment for AMP property-based + edge-case tests
[env:native]
platform = native
test_framework = unity
build_flags =
    -D_USE_MATH_DEFINES
    -DUNITY_INCLUDE_DOUBLE
